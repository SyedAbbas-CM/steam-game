<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Map Editor — Legends of Yore</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }

#toolbar { background: #16213e; padding: 6px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #0f3460; z-index: 10; flex-wrap: wrap; }
#toolbar h1 { font-size: 15px; color: #e94560; margin-right: 8px; white-space: nowrap; }
#toolbar button { background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a8a; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; white-space: nowrap; }
#toolbar button:hover { background: #1a4a8a; }
#toolbar button.active { background: #e94560; border-color: #e94560; }
#toolbar .sep { width: 1px; height: 22px; background: #0f3460; }
#toolbar input { background: #0d1b2a; border: 1px solid #1a4a8a; color: #e0e0e0; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
#toolbar .info { color: #888; font-size: 10px; margin-left: auto; white-space: nowrap; }

#main { display: flex; flex: 1; overflow: hidden; }
#canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #0d1117; cursor: grab; }
#canvas-wrap.dragging { cursor: grabbing; }
#canvas-wrap.painting { cursor: crosshair; }
#canvas-wrap.annotating { cursor: text; }
canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }

#panel { width: 380px; background: #16213e; border-left: 1px solid #0f3460; display: flex; flex-direction: column; overflow: hidden; }
#panel-header { padding: 8px 12px; background: #0f3460; font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
#panel-tabs { display: flex; background: #1a1a2e; border-bottom: 1px solid #0f3460; }
#panel-tabs button { flex: 1; padding: 6px 2px; background: none; border: none; color: #888; font-size: 10px; cursor: pointer; border-bottom: 2px solid transparent; }
#panel-tabs button.active { color: #e94560; border-bottom-color: #e94560; }
#panel-tabs button:hover { color: #e0e0e0; }
#panel-content { flex: 1; overflow-y: auto; padding: 8px 12px; }

.field { margin-bottom: 6px; }
.field label { display: block; font-size: 9px; color: #888; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.field input, .field textarea, .field select { width: 100%; background: #0d1b2a; border: 1px solid #1a4a8a; color: #e0e0e0; padding: 4px 6px; border-radius: 3px; font-size: 11px; font-family: inherit; }
.field textarea { min-height: 40px; resize: vertical; }
.field-row { display: flex; gap: 6px; }
.field-row .field { flex: 1; }

.item-list { list-style: none; }
.item-list li { padding: 5px 7px; background: #0d1b2a; border: 1px solid #1a4a8a; border-radius: 3px; margin-bottom: 3px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 11px; }
.item-list li:hover { border-color: #e94560; }
.npc-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.npc-name { flex: 1; }
.npc-type { color: #888; font-size: 9px; }
.btn-remove { background: none; border: none; color: #e94560; cursor: pointer; font-size: 13px; padding: 1px 4px; }

/* Palette grid */
#palette-grid { display: grid; grid-template-columns: repeat(16, 21px); gap: 1px; margin-bottom: 6px; }
#palette-grid .ptile { width: 21px; height: 21px; cursor: pointer; border: 1px solid #1a4a8a; image-rendering: pixelated; background-size: cover; background-repeat: no-repeat; }
#palette-grid .ptile:hover { border-color: #e94560; }
#palette-grid .ptile.selected { border: 2px solid #e94560; }

/* Annotation input popup */
#ann-popup { position: fixed; z-index: 50; display: none; }
#ann-popup input { background: #0d1b2a; border: 2px solid #4ade80; color: #e0e0e0; padding: 4px 8px; border-radius: 4px; font-size: 12px; width: 200px; outline: none; }

/* Annotation markers on canvas */
.ann-marker { pointer-events: none; }

#statusbar { background: #0d1b2a; padding: 3px 12px; font-size: 10px; color: #666; display: flex; gap: 12px; border-top: 1px solid #0f3460; }
.toast { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); background: #4ade80; color: #000; padding: 6px 16px; border-radius: 5px; font-size: 12px; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
#loading { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 200; font-size: 16px; color: #e94560; }
</style>
</head>

    </div>
</div>

    <span id="status-mouse"></span>

<div id="loading">Loading world data...</div>

// ── State ────────────────────────────────────────────────────────────────
let zones = [];       // flat list for rendering
let zonesMap = {};    // id -> zone data (with grids)
let quests = [];
let selectedZone = null;
let currentTab = 'palette';
let showLabels = true;
let searchFilter = '';

// Canvas
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
let camX = 0, camY = 0, zoom = 1.0;
let isDragging = false, dragStartX = 0, dragStartY = 0, dragStartCamX = 0, dragStartCamY = 0, didDrag = false;

// Tile rendering
const TILE_PX = 32;
const ATLAS_COLS = 16;
let maptilesImg = null, maptilesLoaded = false;
let charsImg = null, chars2Img = null;
const tileCache = {}; // zone_id -> offscreen canvas

// Modes
let mode = 'pan'; // 'pan', 'paint', 'annotate'
let eraserOn = false;
let selectedTileIdx = 1; // default floor
let brushSize = 1;
let isPainting = false;

// Changes tracking
let tileChanges = {};  // {zone_id: Map("x,y" -> [x, y, oldIdx, newIdx])}
let undoStack = [];    // [{zone_id, x, y, oldIdx, newIdx}, ...]
let redoStack = [];

// Annotations
let annotations = {};  // {zone_id: [{x, y, text}]}
let pendingAnnZone = null;
let pendingAnnX = 0, pendingAnnY = 0;

// Imported changeset overlay
let importedChangeset = null;

// ── Init ─────────────────────────────────────────────────────────────────
async function init() {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    maptilesImg = new Image();
    maptilesImg.onload = () => { maptilesLoaded = true; prebakeAllZones(); buildPaletteAtlas(); render(); };
    maptilesImg.src = 'maptiles.png';
    charsImg = new Image(); charsImg.src = 'chars.png';
    chars2Img = new Image(); chars2Img.src = 'chars2.png';

    if (typeof WORLD_DATA === 'undefined') {
        document.getElementById('loading').textContent = 'ERROR: No embedded data. Run bake_editor_data.py first.';
        return;
    }

    zonesMap = WORLD_DATA.zones;
    quests = WORLD_DATA.quests || [];

    // Build flat zones list
    zones = Object.values(zonesMap).map(z => ({
        id: z.id, zone_name: z.zone_name, tileset: z.tileset,
        width: z.width, height: z.height,
        baked_offset: z.baked_offset, baked_scale: z.baked_scale,
        description: z.description, dungeon_base: z.dungeon_base,
        dungeon_count: z.dungeon_count,
        npc_count: (z.npcs || []).length,
        exits: z.exits || [],
    }));

    document.getElementById('status-zones').textContent = `Zones: ${zones.length}`;
    document.getElementById('info-bar').textContent = `${zones.length} zones | ${quests.length} quests`;
    document.getElementById('loading').style.display = 'none';

    fitView();
    switchTab('palette');

    // Annotation popup handler
    document.getElementById('ann-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') { commitAnnotation(e.target.value); e.target.value = ''; }
        if (e.key === 'Escape') { document.getElementById('ann-popup').style.display = 'none'; }
    });

    document.getElementById('import-file').addEventListener('change', handleImportFile);
}

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    render();
}

// ── Prebake zone tile canvases ──────────────────────────────────────────
function prebakeAllZones() {
    if (!maptilesLoaded) return;
    for (const [zid, z] of Object.entries(zonesMap)) {
        prebakeZone(zid, z);
    }
}

function prebakeZone(zid, z) {
    if (!z.grid || !maptilesLoaded) return;
    const oc = document.createElement('canvas');
    oc.width = z.width * TILE_PX;
    oc.height = z.height * TILE_PX;
    const octx = oc.getContext('2d');
    octx.imageSmoothingEnabled = false;
    for (let y = 0; y < z.height; y++) {
        for (let x = 0; x < z.width; x++) {
            const si = z.grid[y][x];
            if (si < 0) continue;
            const sx = (si % ATLAS_COLS) * TILE_PX;
            const sy = Math.floor(si / ATLAS_COLS) * TILE_PX;
            octx.drawImage(maptilesImg, sx, sy, TILE_PX, TILE_PX, x * TILE_PX, y * TILE_PX, TILE_PX, TILE_PX);
        }
    }
    tileCache[zid] = oc;
}

function repaintTile(zid, x, y, spriteIdx) {
    const oc = tileCache[zid];
    if (!oc || !maptilesLoaded) return;
    const octx = oc.getContext('2d');
    octx.imageSmoothingEnabled = false;
    octx.clearRect(x * TILE_PX, y * TILE_PX, TILE_PX, TILE_PX);
    if (spriteIdx >= 0) {
        const sx = (spriteIdx % ATLAS_COLS) * TILE_PX;
        const sy = Math.floor(spriteIdx / ATLAS_COLS) * TILE_PX;
        octx.drawImage(maptilesImg, sx, sy, TILE_PX, TILE_PX, x * TILE_PX, y * TILE_PX, TILE_PX, TILE_PX);
    }
}

// ── Camera ───────────────────────────────────────────────────────────────
function fitView() {
    if (!zones.length) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const z of zones) {
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        minX = Math.min(minX, off.x);
        minY = Math.min(minY, off.y);
        maxX = Math.max(maxX, off.x + (z.width||25)*s);
        maxY = Math.max(maxY, off.y + (z.height||25)*s);
    }
    const ww = (maxX - minX) * TILE_PX, wh = (maxY - minY) * TILE_PX;
    zoom = Math.min(canvas.width / (ww + 80), canvas.height / (wh + 80));
    zoom = Math.max(0.01, Math.min(zoom, 4));
    camX = -(minX * TILE_PX + ww/2) * zoom + canvas.width/2;
    camY = -(minY * TILE_PX + wh/2) * zoom + canvas.height/2;
    updateStatus(); render();
}

// ── Mode switching ──────────────────────────────────────────────────────
function setMode(m) {
    mode = m;
    const wrap = document.getElementById('canvas-wrap');
    wrap.className = m === 'paint' ? 'painting' : m === 'annotate' ? 'annotating' : '';
    document.getElementById('btn-pan').classList.toggle('active', m === 'pan');
    document.getElementById('btn-paint').classList.toggle('active', m === 'paint');
    document.getElementById('btn-annotate').classList.toggle('active', m === 'annotate');
    if (m === 'paint') switchTab('palette');
}

function toggleEraser() {
    eraserOn = !eraserOn;
    document.getElementById('btn-eraser').classList.toggle('active', eraserOn);
    if (eraserOn) setMode('paint');
}

function toggleLabels() {
    showLabels = !showLabels;
    document.getElementById('btn-labels').classList.toggle('active', showLabels);
    render();
}

// ── Mouse handling ───────────────────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');

function screenToWorld(e) {
    const rect = canvas.getBoundingClientRect();
    const wx = (e.clientX - rect.left - camX) / (zoom * TILE_PX);
    const wy = (e.clientY - rect.top - camY) / (zoom * TILE_PX);
    return {wx, wy};
}

function worldToZoneTile(wx, wy) {
    for (const z of zones) {
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        const w = (z.width||25)*s, h = (z.height||25)*s;
        if (wx >= off.x && wx < off.x+w && wy >= off.y && wy < off.y+h) {
            const lx = Math.floor((wx - off.x) / s);
            const ly = Math.floor((wy - off.y) / s);
            if (lx >= 0 && lx < (z.width||25) && ly >= 0 && ly < (z.height||25)) {
                return { zoneId: z.id, x: lx, y: ly, zone: z };
            }
        }
    }
    return null;
}

canvas.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;

    if (mode === 'pan') {
        isDragging = true; didDrag = false;
        dragStartX = e.clientX; dragStartY = e.clientY;
        dragStartCamX = camX; dragStartCamY = camY;
        wrap.classList.add('dragging');
        canvas.setPointerCapture(e.pointerId);
    } else if (mode === 'paint') {
        isPainting = true;
        canvas.setPointerCapture(e.pointerId);
        const {wx, wy} = screenToWorld(e);
        paintAt(wx, wy);
    } else if (mode === 'annotate') {
        const {wx, wy} = screenToWorld(e);
        startAnnotation(wx, wy, e.clientX, e.clientY);
    }
});

canvas.addEventListener('pointermove', e => {
    const {wx, wy} = screenToWorld(e);
    document.getElementById('status-mouse').textContent = `Tile: ${Math.floor(wx)},${Math.floor(wy)}`;

    if (mode === 'pan' && isDragging) {
        const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
        camX = dragStartCamX + dx; camY = dragStartCamY + dy;
        render();
    } else if (mode === 'paint' && isPainting) {
        paintAt(wx, wy);
    }
});

canvas.addEventListener('pointerup', e => {
    if (mode === 'pan' && isDragging) {
        isDragging = false;
        wrap.classList.remove('dragging');
        canvas.releasePointerCapture(e.pointerId);
        if (!didDrag) {
            const {wx, wy} = screenToWorld(e);
            handleClick(wx, wy);
        }
    } else if (mode === 'paint') {
        isPainting = false;
        canvas.releasePointerCapture(e.pointerId);
    }
});

canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const worldX = (mx - camX) / zoom, worldY = (my - camY) / zoom;
    zoom *= e.deltaY < 0 ? 1.2 : 0.833;
    zoom = Math.max(0.01, Math.min(zoom, 8));
    camX = mx - worldX * zoom; camY = my - worldY * zoom;
    updateStatus(); render();
}, { passive: false });

function handleClick(wx, wy) {
    for (const z of zones) {
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        if (wx >= off.x && wx < off.x + (z.width||25)*s && wy >= off.y && wy < off.y + (z.height||25)*s) {
            selectZone(z.id);
            return;
        }
    }
}

// ── Tile Painting ───────────────────────────────────────────────────────
function paintAt(wx, wy) {
    const hit = worldToZoneTile(wx, wy);
    if (!hit) return;
    const z = zonesMap[hit.zoneId];
    if (!z || !z.grid) return;

    const tileIdx = eraserOn ? (1 + (z.tileset < 30 ? z.tileset : 0)) : selectedTileIdx;
    const half = Math.floor(brushSize / 2);

    for (let dy = -half; dy < brushSize - half; dy++) {
        for (let dx = -half; dx < brushSize - half; dx++) {
            const tx = hit.x + dx, ty = hit.y + dy;
            if (tx < 0 || tx >= z.width || ty < 0 || ty >= z.height) continue;

            const oldIdx = z.grid[ty][tx];
            if (oldIdx === tileIdx) continue;

            // Record change
            if (!tileChanges[hit.zoneId]) tileChanges[hit.zoneId] = new Map();
            const key = `${tx},${ty}`;
            const existing = tileChanges[hit.zoneId].get(key);
            const origOld = existing ? existing[2] : oldIdx;
            tileChanges[hit.zoneId].set(key, [tx, ty, origOld, tileIdx]);

            undoStack.push({ zoneId: hit.zoneId, x: tx, y: ty, oldIdx, newIdx: tileIdx });
            redoStack = [];

            // Apply
            z.grid[ty][tx] = tileIdx;
            repaintTile(hit.zoneId, tx, ty, tileIdx);
        }
    }
    updateStatus();
    render();
}

function undo() {
    if (!undoStack.length) return;
    const act = undoStack.pop();
    const z = zonesMap[act.zoneId];
    if (!z) return;
    z.grid[act.y][act.x] = act.oldIdx;
    repaintTile(act.zoneId, act.x, act.y, act.oldIdx);

    // Update tileChanges map
    if (tileChanges[act.zoneId]) {
        const key = `${act.x},${act.y}`;
        const entry = tileChanges[act.zoneId].get(key);
        if (entry) {
            if (entry[2] === act.oldIdx) {
                tileChanges[act.zoneId].delete(key);
            } else {
                entry[3] = act.oldIdx;
            }
        }
    }
    redoStack.push(act);
    updateStatus(); render();
}

function redo() {
    if (!redoStack.length) return;
    const act = redoStack.pop();
    const z = zonesMap[act.zoneId];
    if (!z) return;
    z.grid[act.y][act.x] = act.newIdx;
    repaintTile(act.zoneId, act.x, act.y, act.newIdx);

    if (!tileChanges[act.zoneId]) tileChanges[act.zoneId] = new Map();
    const key = `${act.x},${act.y}`;
    const existing = tileChanges[act.zoneId].get(key);
    const origOld = existing ? existing[2] : act.oldIdx;
    tileChanges[act.zoneId].set(key, [act.x, act.y, origOld, act.newIdx]);

    undoStack.push(act);
    updateStatus(); render();
}

// ── Annotations ─────────────────────────────────────────────────────────
function startAnnotation(wx, wy, screenX, screenY) {
    const hit = worldToZoneTile(wx, wy);
    if (!hit) return;
    pendingAnnZone = hit.zoneId;
    pendingAnnX = hit.x; pendingAnnY = hit.y;
    const popup = document.getElementById('ann-popup');
    popup.style.display = 'block';
    popup.style.left = screenX + 'px';
    popup.style.top = (screenY - 30) + 'px';
    const inp = document.getElementById('ann-input');
    inp.value = '';
    inp.focus();
}

function commitAnnotation(text) {
    if (!text.trim() || !pendingAnnZone) return;
    if (!annotations[pendingAnnZone]) annotations[pendingAnnZone] = [];
    annotations[pendingAnnZone].push({ x: pendingAnnX, y: pendingAnnY, text: text.trim() });
    document.getElementById('ann-popup').style.display = 'none';
    updateStatus(); render();
    if (currentTab === 'notes') switchTab('notes');
}

// ── Rendering ────────────────────────────────────────────────────────────
function render() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(camX, camY);
    ctx.scale(zoom, zoom);

    for (const z of zones) drawZone(z);
    drawConnections();
    drawAnnotations();
    drawImportedOverlay();
    if (showLabels) for (const z of zones) drawZoneLabel(z);

    ctx.restore();
}

function drawZone(z) {
    const off = z.baked_offset || {x:0,y:0};
    const s = z.baked_scale || 1;
    const px = off.x * TILE_PX, py = off.y * TILE_PX;
    const pw = (z.width||25)*s*TILE_PX, ph = (z.height||25)*s*TILE_PX;
    const isSelected = selectedZone === z.id;
    const isFiltered = searchFilter && !z.zone_name.toLowerCase().includes(searchFilter) && !z.id.toLowerCase().includes(searchFilter);

    ctx.save();
    if (isFiltered) ctx.globalAlpha = 0.15;

    const cached = tileCache[z.id];
    if (cached && maptilesLoaded) {
        ctx.drawImage(cached, px, py, pw, ph);
    } else {
        const COLORS = {0:'#4b5563',8:'#78531e',16:'#1e3a6e',112:'#1a5c30',144:'#5ba8c8',192:'#0f3d1a',224:'#9a7b18',240:'#5a2e0a'};
        ctx.fillStyle = COLORS[z.tileset] || '#4b5563';
        ctx.globalAlpha *= 0.6;
        ctx.fillRect(px, py, pw, ph);
    }

    ctx.globalAlpha = isFiltered ? 0.15 : 1;
    ctx.strokeStyle = isSelected ? '#e94560' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = isSelected ? 4 : 1;
    ctx.strokeRect(px, py, pw, ph);
    if (isSelected) { ctx.fillStyle = 'rgba(233,69,96,0.08)'; ctx.fillRect(px, py, pw, ph); }
    ctx.restore();
}

function drawZoneLabel(z) {
    const off = z.baked_offset || {x:0,y:0};
    const s = z.baked_scale || 1;
    const px = off.x*TILE_PX, py = off.y*TILE_PX;
    const pw = (z.width||25)*s*TILE_PX, ph = (z.height||25)*s*TILE_PX;
    const screenW = pw * zoom;
    if (screenW < 30) return;
    const isFiltered = searchFilter && !z.zone_name.toLowerCase().includes(searchFilter) && !z.id.toLowerCase().includes(searchFilter);

    ctx.save();
    if (isFiltered) ctx.globalAlpha = 0.15;
    const fs = Math.max(8/zoom, Math.min(14/zoom, pw/6));
    const pad = 4/zoom;
    const name = z.zone_name || z.id;
    ctx.font = `bold ${fs}px sans-serif`;
    const tm = ctx.measureText(name);
    const lw = tm.width + pad*3, lh = fs + pad*2;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.beginPath(); ctx.roundRect(px+pw/2-lw/2, py+ph/2-lh/2, lw, lh, pad); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(name, px+pw/2, py+ph/2);

    if (z.npc_count > 0 && screenW > 50) {
        const bs = fs*0.6;
        ctx.fillStyle = '#e94560'; ctx.beginPath(); ctx.arc(px+pw-bs*1.5, py+bs*1.5, bs*0.8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = `bold ${bs*0.9}px sans-serif`; ctx.fillText(z.npc_count, px+pw-bs*1.5, py+bs*1.5);
    }
    ctx.restore();
}

function drawConnections() {
    ctx.save();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(233,69,96,0.3)'; ctx.setLineDash([6,4]);
    for (const z of zones) {
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        for (const ex of z.exits) {
            const t = zones.find(t => t.id === ex.target);
            if (!t) continue;
            const tOff = t.baked_offset || {x:0,y:0};
            const tS = t.baked_scale || 1;
            ctx.beginPath();
            ctx.moveTo((off.x + (ex.x||0)*s)*TILE_PX, (off.y + (ex.y||0)*s)*TILE_PX);
            ctx.lineTo((tOff.x + (ex.tx||0)*tS)*TILE_PX, (tOff.y + (ex.ty||0)*tS)*TILE_PX);
            ctx.stroke();
        }
    }
    ctx.restore();
}

function drawAnnotations() {
    ctx.save();
    for (const [zid, anns] of Object.entries(annotations)) {
        const z = zones.find(z => z.id === zid);
        if (!z) continue;
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        for (const ann of anns) {
            const px = (off.x + ann.x * s) * TILE_PX;
            const py = (off.y + ann.y * s) * TILE_PX;
            const fs = Math.max(6/zoom, Math.min(11/zoom, 200));
            const pad = 3/zoom;

            // Marker dot
            ctx.fillStyle = '#4ade80';
            ctx.beginPath(); ctx.arc(px, py, 4/zoom, 0, Math.PI*2); ctx.fill();

            // Text bubble
            ctx.font = `${fs}px sans-serif`;
            const tm = ctx.measureText(ann.text);
            const bw = tm.width + pad*2, bh = fs + pad*2;
            ctx.fillStyle = 'rgba(74,222,128,0.9)';
            ctx.beginPath(); ctx.roundRect(px + 6/zoom, py - bh - 2/zoom, bw, bh, pad); ctx.fill();
            ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
            ctx.fillText(ann.text, px + 6/zoom + pad, py - bh - 2/zoom + pad);
        }
    }
    ctx.restore();
}

function drawImportedOverlay() {
    if (!importedChangeset) return;
    ctx.save();
    ctx.globalAlpha = 0.4;
    for (const [zid, changes] of Object.entries(importedChangeset.tile_changes || {})) {
        const z = zones.find(z => z.id === zid);
        if (!z) continue;
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        for (const [x, y, oldIdx, newIdx] of changes) {
            const px = (off.x + x*s) * TILE_PX;
            const py = (off.y + y*s) * TILE_PX;
            const pw = s * TILE_PX, ph = s * TILE_PX;
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(px, py, pw, ph);
        }
    }
    // Imported annotations
    for (const [zid, anns] of Object.entries(importedChangeset.annotations || {})) {
        const z = zones.find(z => z.id === zid);
        if (!z) continue;
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        for (const ann of anns) {
            const px = (off.x + ann.x*s)*TILE_PX, py = (off.y + ann.y*s)*TILE_PX;
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(px, py, 5/zoom, 0, Math.PI*2); ctx.fill();
        }
    }
    ctx.restore();
}

// ── Zone Selection ───────────────────────────────────────────────────────
function selectZone(zoneId) {
    selectedZone = zoneId;
    const z = zones.find(z => z.id === zoneId);
    document.getElementById('panel-title').textContent = z ? (z.zone_name || z.id) : zoneId;
    document.getElementById('panel-subtitle').textContent = zoneId;
    switchTab(currentTab);
    render();
}

// ── Tab Switching ────────────────────────────────────────────────────────
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('#panel-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    const content = document.getElementById('panel-content');

    if (tab === 'palette') { renderPaletteTab(); return; }
    if (tab === 'notes') { renderNotesTab(); return; }
    if (!selectedZone || !zonesMap[selectedZone]) {
        content.innerHTML = '<p style="color:#666;text-align:center;margin-top:30px">Click a zone first</p>';
        return;
    }
    const d = zonesMap[selectedZone];
    switch (tab) {
        case 'info': renderInfoTab(d); break;
        case 'npcs': renderNpcsTab(d); break;
        case 'exits': renderExitsTab(d); break;
        case 'quests': renderQuestsTab(d); break;
    }
}

// Pre-render palette atlas as a data URL
let paletteDataUrl = '';
function buildPaletteAtlas() {
    if (!maptilesLoaded) return;
    // Already have the maptiles image, use it directly as background
    paletteDataUrl = maptilesImg.src;
    if (currentTab === 'palette') renderPaletteTab();
}

function renderPaletteTab() {
    const content = document.getElementById('panel-content');
    let html = '<div class="field-row" style="margin-bottom:6px;align-items:end"><div class="field"><label>Brush Size</label>';
    html += '<select id="brush-sel" onchange="brushSize=parseInt(this.value)" style="background:#0d1b2a;border:1px solid #1a4a8a;color:#e0e0e0;padding:3px;font-size:11px;width:100%">';
    html += `<option value="1" ${brushSize===1?'selected':''}>1x1</option>`;
    html += `<option value="2" ${brushSize===2?'selected':''}>2x2</option>`;
    html += `<option value="3" ${brushSize===3?'selected':''}>3x3</option>`;
    html += `<option value="5" ${brushSize===5?'selected':''}>5x5</option>`;
    html += '</select></div>';
    html += `<div class="field"><label>Selected: ${selectedTileIdx}</label>`;
    html += `<div style="width:32px;height:32px;border:2px solid #e94560;border-radius:3px;image-rendering:pixelated;background-image:url('${paletteDataUrl}');background-size:${16*32}px ${16*32}px;background-position:-${(selectedTileIdx%16)*32}px -${Math.floor(selectedTileIdx/16)*32}px"></div></div></div>`;
    html += '<div id="palette-grid">';
    for (let i = 0; i < 256; i++) {
        const col = i % 16, row = Math.floor(i / 16);
        const bgPos = `-${col*21}px -${row*21}px`;
        html += `<div class="ptile${i===selectedTileIdx?' selected':''}" data-idx="${i}" onclick="selectBrushTile(${i})" style="background-image:url('${paletteDataUrl}');background-size:${16*21}px ${16*21}px;background-position:${bgPos}"></div>`;
    }
    html += '</div>';
    content.innerHTML = html;
}

function selectBrushTile(idx) {
    selectedTileIdx = idx;
    eraserOn = false;
    document.getElementById('btn-eraser').classList.remove('active');
    setMode('paint');
    document.querySelectorAll('#palette-grid .ptile').forEach(el => {
        el.classList.toggle('selected', parseInt(el.dataset.idx) === idx);
    });
    // Update selected preview
    renderPaletteTab();
}

function renderInfoTab(d) {
    document.getElementById('panel-content').innerHTML = `
        <div class="field"><label>Zone Name</label><input value="${esc(d.zone_name||'')}" readonly></div>
        <div class="field"><label>Description</label><textarea readonly>${esc(d.description||'')}</textarea></div>
        <div class="field-row">
            <div class="field"><label>Width</label><input value="${d.width}" readonly></div>
            <div class="field"><label>Height</label><input value="${d.height}" readonly></div>
            <div class="field"><label>Tileset</label><input value="${d.tileset}" readonly></div>
        </div>
        <div class="field-row">
            <div class="field"><label>Scale</label><input value="${d.baked_scale||1}" readonly></div>
            <div class="field"><label>Dungeon</label><input value="${d.dungeon_base||'none'}" readonly></div>
        </div>
    `;
}

function renderNpcsTab(d) {
    const npcs = d.npcs || [];
    const COLORS = {shop:'#fbbf24',elder:'#60a5fa',scriptfile:'#4ade80',message:'#9ca3af',tips:'#a78bfa'};
    let html = '<ul class="item-list">';
    npcs.forEach(npc => {
        html += `<li><span class="npc-dot" style="background:${COLORS[npc.type]||'#666'}"></span>
            <span class="npc-name">${esc(npc.name||'?')}</span>
            <span class="npc-type">${npc.type} (${npc.x},${npc.y})</span></li>`;
    });
    html += '</ul>';
    if (!npcs.length) html = '<p style="color:#666;text-align:center;margin-top:20px">No NPCs</p>';
    document.getElementById('panel-content').innerHTML = html;
}

function renderExitsTab(d) {
    const exits = d.exits || [];
    let html = '';
    exits.forEach(ex => {
        const tgt = zones.find(z => z.id === ex.target);
        html += `<div style="padding:5px 7px;background:#0d1b2a;border:1px solid #1a4a8a;border-radius:3px;margin-bottom:3px;font-size:11px">
            -> <strong>${esc(tgt?.zone_name || ex.target)}</strong>
            <span style="color:#888;font-size:9px"> from (${ex.x},${ex.y}) to (${ex.tx},${ex.ty})</span></div>`;
    });
    if (!exits.length) html = '<p style="color:#666;text-align:center;margin-top:20px">No exits</p>';
    document.getElementById('panel-content').innerHTML = html;
}

function renderQuestsTab(d) {
    const related = quests.filter(q => q.location === d.id);
    let html = '';
    related.forEach(q => {
        html += `<div style="padding:5px 7px;background:#0d1b2a;border:1px solid #1a4a8a;border-radius:3px;margin-bottom:3px;font-size:11px">
            <strong>${esc(q.title)}</strong> <span style="color:#888">Lv.${q.level}</span>
            <div style="color:#aaa;font-size:10px;margin-top:2px">${esc(q.summary||'')}</div></div>`;
    });
    if (!related.length) html = '<p style="color:#666;text-align:center;margin-top:20px">No quests in this zone</p>';
    document.getElementById('panel-content').innerHTML = html;
}

function renderNotesTab() {
    let html = '<p style="color:#888;font-size:10px;margin-bottom:6px">Click "Note" mode then click on map to add notes</p>';
    let total = 0;
    for (const [zid, anns] of Object.entries(annotations)) {
        if (!anns.length) continue;
        const z = zones.find(z => z.id === zid);
        html += `<div style="margin-bottom:8px"><strong style="font-size:11px">${esc(z?.zone_name || zid)}</strong>`;
        anns.forEach((ann, i) => {
            html += `<div style="padding:4px 6px;background:#0d1b2a;border:1px solid #1a4a8a;border-radius:3px;margin:2px 0;font-size:11px;display:flex;align-items:center">
                <span style="flex:1">(${ann.x},${ann.y}) ${esc(ann.text)}</span>
                <button class="btn-remove" onclick="removeAnnotation('${zid}',${i})">x</button>
            </div>`;
            total++;
        });
        html += '</div>';
    }
    if (!total) html += '<p style="color:#666;text-align:center;margin-top:20px">No notes yet</p>';
    document.getElementById('panel-content').innerHTML = html;
}

function removeAnnotation(zid, idx) {
    if (annotations[zid]) { annotations[zid].splice(idx, 1); updateStatus(); render(); renderNotesTab(); }
}

// ── Export / Import Changeset ───────────────────────────────────────────
function exportChangeset() {
    const author = document.getElementById('author-name').value || 'Anonymous';
    const changeset = {
        version: 1,
        author,
        timestamp: new Date().toISOString(),
        tile_changes: {},
        annotations: {},
    };

    for (const [zid, changeMap] of Object.entries(tileChanges)) {
        const filtered = [];
        for (const [key, entry] of changeMap) {
            if (entry[2] !== entry[3]) filtered.push(entry);
        }
        if (filtered.length) changeset.tile_changes[zid] = filtered;
    }

    for (const [zid, anns] of Object.entries(annotations)) {
        if (anns.length) changeset.annotations[zid] = anns;
    }

    const totalChanges = Object.values(changeset.tile_changes).reduce((s, v) => s + v.length, 0);
    const totalNotes = Object.values(changeset.annotations).reduce((s, v) => s + v.length, 0);

    if (totalChanges === 0 && totalNotes === 0) {
        showToast('Nothing to export', true);
        return;
    }

    const blob = new Blob([JSON.stringify(changeset, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `changeset_${author.replace(/\s+/g,'_')}_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast(`Exported: ${totalChanges} tile changes, ${totalNotes} notes`);
}

function importChangeset() {
    document.getElementById('import-file').click();
}

function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            importedChangeset = JSON.parse(ev.target.result);
            const tc = Object.values(importedChangeset.tile_changes || {}).reduce((s,v) => s+v.length, 0);
            const an = Object.values(importedChangeset.annotations || {}).reduce((s,v) => s+v.length, 0);
            showToast(`Imported: ${importedChangeset.author} — ${tc} tiles, ${an} notes`);
            render();
        } catch (err) {
            showToast('Invalid changeset file', true);
        }
    };
    reader.readAsText(file);
    e.target.value = '';
}

// ── Utilities ────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function filterZones(q) { searchFilter = q.toLowerCase(); render(); }

function updateStatus() {
    document.getElementById('status-zoom').textContent = `Zoom: ${(zoom*100).toFixed(0)}%`;
    let tc = 0;
    for (const m of Object.values(tileChanges)) tc += m.size;
    document.getElementById('status-changes').textContent = `Changes: ${tc}`;
    let nc = 0;
    for (const a of Object.values(annotations)) nc += a.length;
    document.getElementById('status-notes').textContent = `Notes: ${nc}`;
}

function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? '#e94560' : '#4ade80';
    t.style.color = isError ? '#fff' : '#000';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
    if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
    if (e.key === 'Escape') {
        document.getElementById('ann-popup').style.display = 'none';
        importedChangeset = null;
        render();
    }
    if (e.key === 'b' && !e.ctrlKey) setMode('paint');
    if (e.key === 'v' && !e.ctrlKey) setMode('pan');
    if (e.key === 'n' && !e.ctrlKey) setMode('annotate');
    if (e.key === 'e' && !e.ctrlKey) toggleEraser();
});

init();
</script>
