function stampSelection() {
    if (!selection || !selectionTiles) return;
    const gid = ++undoGroupId;
    const paintLayer = layerPaints[activeLayer];
    const chunksToInvalidate = new Set();
    const origin = selectionDragOrigin;

    // Step 1: Erase source tiles (if this was a move, not first placement)
    if (origin && (origin.x1 !== selection.x1 || origin.y1 !== selection.y1)) {
        for (const [rkey, sprite] of Object.entries(selectionTiles)) {
            const [rx, ry] = rkey.split(',').map(Number);
            const srcX = origin.x1 + rx, srcY = origin.y1 + ry;
            // Don't erase if source overlaps with destination
            const dstX = selection.x1 + rx, dstY = selection.y1 + ry;
            if (srcX === dstX && srcY === dstY) continue;
            const srcKey = srcX + ',' + srcY;
            const oldSrc = getLayerTile(srcKey);
            if (oldSrc !== -1) {
                paintLayer[srcKey] = -1;
                undoStack.push({ terrain: true, layer: activeLayer, wx: srcX, wy: srcY, oldIdx: oldSrc, newIdx: -1, group: gid });
                chunksToInvalidate.add(Math.floor(srcX / TERRAIN_CHUNK) + ',' + Math.floor(srcY / TERRAIN_CHUNK));
            }
        }
    }

    // Step 2: Paste tiles at destination
    for (const [rkey, sprite] of Object.entries(selectionTiles)) {
        const [rx, ry] = rkey.split(',').map(Number);
        const tx = selection.x1 + rx, ty = selection.y1 + ry;
        const key = tx + ',' + ty;
        const oldIdx = paintLayer[key] !== undefined ? paintLayer[key] : -1;
        if (oldIdx !== sprite) {
            paintLayer[key] = sprite;
            undoStack.push({ terrain: true, layer: activeLayer, wx: tx, wy: ty, oldIdx, newIdx: sprite, group: gid });
            chunksToInvalidate.add(Math.floor(tx / TERRAIN_CHUNK) + ',' + Math.floor(ty / TERRAIN_CHUNK));
        }
    }
    selectionDragOrigin = null;
    redoStack = [];
    invalidateChunks(chunksToInvalidate);
    saveAnnotations();
    showToast(`Moved ${Object.keys(selectionTiles).length} tiles on ${activeLayer}`);
    updateStatus();
}

function eyedropAt(wx, wy) {
    const tx = Math.floor(wx), ty = Math.floor(wy);
    const key = tx + ',' + ty;
    let spriteIdx;
    for (let i = PAINT_LAYERS.length - 1; i >= 0; i--) {
        const v = layerPaints[PAINT_LAYERS[i].id][key];
        if (v !== undefined && v >= 0) { spriteIdx = v; break; }
    }
    if (spriteIdx === undefined && terrainOverlay) spriteIdx = terrainOverlay[key];
    if (spriteIdx === undefined && terrainGround) spriteIdx = terrainGround[key];
    // Reset eyedropper state back to paint mode
    if (mode === 'eyedropper') {
        mode = 'paint';
        document.getElementById('btn-eyedropper').classList.remove('active');
    }
    if (spriteIdx !== undefined && spriteIdx >= 0) {
        selectBrushTile(spriteIdx);
        showToast(`Picked tile #${spriteIdx}`);
    } else {
        showToast('No tile here', true);
    }
}

function undoOne(act) {
    if (act.terrain) {
        const layer = act.layer || 'ground';
        const paints = layerPaints[layer] || layerPaints.ground;
        const key = act.wx + ',' + act.wy;
        paints[key] = act.oldIdx;
        const cx = Math.floor(act.wx / TERRAIN_CHUNK), cy = Math.floor(act.wy / TERRAIN_CHUNK);
        delete terrainChunks[cx + ',' + cy];
    } else {
        const z = zonesMap[act.zoneId];
        if (!z) return;
        z.grid[act.y][act.x] = act.oldIdx;
        repaintTile(act.zoneId, act.x, act.y, act.oldIdx);
        if (tileChanges[act.zoneId]) {
            const key = `${act.x},${act.y}`;
            const entry = tileChanges[act.zoneId].get(key);
            if (entry) {
                if (entry[2] === act.oldIdx) tileChanges[act.zoneId].delete(key);
                else entry[3] = act.oldIdx;
            }
        }
    }
}

function redoOne(act) {
    if (act.terrain) {
        const layer = act.layer || 'ground';
        const paints = layerPaints[layer] || layerPaints.ground;
        const key = act.wx + ',' + act.wy;
        paints[key] = act.newIdx;
        const cx = Math.floor(act.wx / TERRAIN_CHUNK), cy = Math.floor(act.wy / TERRAIN_CHUNK);
        delete terrainChunks[cx + ',' + cy];
    } else {
        const z = zonesMap[act.zoneId];
        if (!z) return;
        z.grid[act.y][act.x] = act.newIdx;
        repaintTile(act.zoneId, act.x, act.y, act.newIdx);
        if (!tileChanges[act.zoneId]) tileChanges[act.zoneId] = new Map();
        const key = `${act.x},${act.y}`;
        const existing = tileChanges[act.zoneId].get(key);
        const origOld = existing ? existing[2] : act.oldIdx;
        tileChanges[act.zoneId].set(key, [act.x, act.y, origOld, act.newIdx]);
    }
}

function undo() {
    if (!undoStack.length) return;
    const act = undoStack.pop();
    undoOne(act);
    redoStack.push(act);
    // Undo entire group if grouped
    if (act.group) {
        while (undoStack.length && undoStack[undoStack.length-1].group === act.group) {
            const a = undoStack.pop();
            undoOne(a);
            redoStack.push(a);
        }
    }
    updateStatus(); render();
}

function redo() {
    if (!redoStack.length) return;
    const act = redoStack.pop();
    redoOne(act);
    undoStack.push(act);
    // Redo entire group if grouped
    if (act.group) {
        while (redoStack.length && redoStack[redoStack.length-1].group === act.group) {
            const a = redoStack.pop();
            redoOne(a);
            undoStack.push(a);
        }
    }
    updateStatus(); render();
}

// ── Annotations ─────────────────────────────────────────────────────────
function startAnnotation(wx, wy, screenX, screenY) {
    const hit = worldToZoneTile(wx, wy);
    if (!hit) return;
    pendingAnnZone = hit.zoneId;
    pendingAnnX = hit.x; pendingAnnY = hit.y;
    const popup = document.getElementById('ann-popup');
    popup.style.display = 'block';
    popup.style.left = screenX + 'px';
    popup.style.top = (screenY - 30) + 'px';
    const inp = document.getElementById('ann-input');
    inp.value = '';
    inp.focus();
}

function commitAnnotation(text) {
    if (!text.trim() || !pendingAnnZone) return;
    if (!annotations[pendingAnnZone]) annotations[pendingAnnZone] = [];
    annotations[pendingAnnZone].push({ x: pendingAnnX, y: pendingAnnY, text: text.trim() });
    document.getElementById('ann-popup').style.display = 'none';
    saveAnnotations();
    updateStatus(); render();
    if (currentTab === 'notes') switchTab('notes');
}

function saveAnnotations() {
    try { localStorage.setItem('loy_annotations', JSON.stringify(annotations)); } catch(e) {}
    try { localStorage.setItem('loy_ideas', JSON.stringify(savedIdeas)); } catch(e) {}
    try { localStorage.setItem('loy_tile_changes', JSON.stringify(
        Object.fromEntries(Object.entries(tileChanges).map(([k,v]) => [k, [...v.values()]]))
    )); } catch(e) {}
    try { localStorage.setItem('loy_layer_paints', JSON.stringify(layerPaints)); } catch(e) {}
    // Legacy compat: also save ground as terrain_paints
    try { localStorage.setItem('loy_terrain_paints', JSON.stringify(layerPaints.ground)); } catch(e) {}
    try { localStorage.setItem('loy_custom_areas', JSON.stringify(customAreas)); } catch(e) {}
    try { localStorage.setItem('loy_npc_moves', JSON.stringify(npcMoves)); } catch(e) {}
    try { localStorage.setItem('loy_zone_overrides', JSON.stringify(zoneOverrides)); } catch(e) {}
    try { localStorage.setItem('loy_npc_dialogue', JSON.stringify(npcDialogueOverrides)); } catch(e) {}
    try { localStorage.setItem('loy_player_spawn', JSON.stringify(playerSpawn)); } catch(e) {}
    if (baseline) try { localStorage.setItem('loy_baseline', JSON.stringify(baseline)); } catch(e) {}
}

function loadSavedState() {
    try {
        const a = localStorage.getItem('loy_annotations');
        if (a) annotations = JSON.parse(a);
        const i = localStorage.getItem('loy_ideas');
        if (i) savedIdeas = JSON.parse(i);
        const tc = localStorage.getItem('loy_tile_changes');
        if (tc) {
            const parsed = JSON.parse(tc);
            for (const [zid, changes] of Object.entries(parsed)) {
                tileChanges[zid] = new Map();
                for (const c of changes) {
                    tileChanges[zid].set(`${c[0]},${c[1]}`, c);
                    const z = zonesMap[zid];
                    if (z && z.grid && c[1] < z.height && c[0] < z.width) {
                        z.grid[c[1]][c[0]] = c[3];
                    }
                }
            }
        }
        // Load per-layer paints (new format) or legacy single-layer
        const lp = localStorage.getItem('loy_layer_paints');
        if (lp) {
            const parsed = JSON.parse(lp);
            for (const lid of Object.keys(layerPaints)) {
                if (parsed[lid]) layerPaints[lid] = parsed[lid];
            }
        } else {
            // Legacy: old single terrainPaints goes into ground layer
            const tp = localStorage.getItem('loy_terrain_paints');
            if (tp) layerPaints.ground = JSON.parse(tp);
        }
        terrainPaints = layerPaints.ground;
        const ca = localStorage.getItem('loy_custom_areas');
        if (ca) customAreas = JSON.parse(ca);
        const nm = localStorage.getItem('loy_npc_moves');
        if (nm) npcMoves = JSON.parse(nm);
        const zo = localStorage.getItem('loy_zone_overrides');
        if (zo) zoneOverrides = JSON.parse(zo);
        const nd = localStorage.getItem('loy_npc_dialogue');
        if (nd) npcDialogueOverrides = JSON.parse(nd);
        const ps = localStorage.getItem('loy_player_spawn');
        if (ps) playerSpawn = JSON.parse(ps);
        const bl = localStorage.getItem('loy_baseline');
        if (bl) baseline = JSON.parse(bl);
    } catch(e) {}
}

// ── Rendering ────────────────────────────────────────────────────────────
function render() {
    if (!ctx) return;
    ctx.imageSmoothingEnabled = false; // crisp pixel art like Godot
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(camX, camY);
    ctx.scale(zoom, zoom);

    if (terrainReady) {
        drawTerrain(); // chunks include paint layer overrides
    } else {
        for (const z of zones) drawZone(z);
    }
    for (const z of zones) drawZoneOutline(z);
    drawConnections();
    if (showNpcs) for (const z of zones) drawNpcMarkers(z);
    drawPlayerSpawn();
    if (showQuests) for (const z of zones) drawQuestMarkers(z);
    for (const z of zones) drawDungeonLabel(z);
    drawAnnotations();
    drawImportedOverlay();
    if (showLabels) for (const z of zones) drawZoneLabel(z);

    // Draw custom areas/regions
    for (const area of customAreas) {
        const ax = area.x1 * TILE_PX, ay = area.y1 * TILE_PX;
        const aw = (area.x2 - area.x1 + 1) * TILE_PX;
        const ah = (area.y2 - area.y1 + 1) * TILE_PX;
        const isSelected = selectedCustomArea && selectedCustomArea.name === area.name;
        const rt = REGION_TYPES.find(r => r.id === (area.type || 'area')) || REGION_TYPES[0];
        const color = isSelected ? '#fbbf24' : rt.color;
        ctx.strokeStyle = color;
        ctx.lineWidth = (isSelected ? 3 : 2) / zoom;
        ctx.setLineDash([8/zoom, 4/zoom]);
        ctx.strokeRect(ax, ay, aw, ah);
        ctx.setLineDash([]);
        ctx.fillStyle = color.replace(')', ',0.08)').replace('rgb', 'rgba').replace('#', '');
        // Hex to rgba fill
        const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
        ctx.fillStyle = `rgba(${r},${g},${b},${isSelected ? 0.12 : 0.06})`;
        ctx.fillRect(ax, ay, aw, ah);
        const fs = Math.max(8/zoom, Math.min(14/zoom, aw/6));
        ctx.font = `bold ${fs}px sans-serif`;
        ctx.fillStyle = color; ctx.textAlign = 'center';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2/zoom;
        ctx.strokeText(area.name, ax + aw/2, ay + ah/2);
        ctx.fillText(area.name, ax + aw/2, ay + ah/2);
        // Type label below name
        ctx.font = `${fs*0.7}px sans-serif`;
        ctx.fillStyle = color;
        ctx.strokeText(rt.name, ax + aw/2, ay + ah/2 + fs);
        ctx.fillText(rt.name, ax + aw/2, ay + ah/2 + fs);
    }

    // Selection box
    if (selection && selectionTiles) {
        const sx = selection.x1 * TILE_PX, sy = selection.y1 * TILE_PX;
        const sw = (selection.x2 - selection.x1 + 1) * TILE_PX;
        const sh = (selection.y2 - selection.y1 + 1) * TILE_PX;
        // Draw captured tiles as semi-transparent overlay
        ctx.globalAlpha = 0.7;
        for (const [rkey, sprite] of Object.entries(selectionTiles)) {
            const [rx, ry] = rkey.split(',').map(Number);
            if (sprite >= 0) {
                drawTileFromIdx(ctx, sprite, sx + rx*TILE_PX, sy + ry*TILE_PX, TILE_PX);
            }
        }
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 2 / zoom;
        ctx.setLineDash([6/zoom, 3/zoom]);
        ctx.strokeRect(sx, sy, sw, sh);
        ctx.setLineDash([]);
    }
    // Selection draw preview
    if (boxSelectMode && isPainting && selectionStart && boxCurrent) {
        const x1 = Math.min(selectionStart.wx, boxCurrent.wx) * TILE_PX;
        const y1 = Math.min(selectionStart.wy, boxCurrent.wy) * TILE_PX;
        const x2 = (Math.max(selectionStart.wx, boxCurrent.wx) + 1) * TILE_PX;
        const y2 = (Math.max(selectionStart.wy, boxCurrent.wy) + 1) * TILE_PX;
        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 2 / zoom;
        ctx.setLineDash([6/zoom, 3/zoom]);
        ctx.strokeRect(x1, y1, x2-x1, y2-y1);
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(96,165,250,0.15)';
        ctx.fillRect(x1, y1, x2-x1, y2-y1);
    }

    // Area draw preview
    if (areaCreationMode && areaDrawStart && boxCurrent && isPainting) {
        const x1 = Math.min(areaDrawStart.wx, boxCurrent.wx) * TILE_PX;
        const y1 = Math.min(areaDrawStart.wy, boxCurrent.wy) * TILE_PX;
        const x2 = (Math.max(areaDrawStart.wx, boxCurrent.wx) + 1) * TILE_PX;
        const y2 = (Math.max(areaDrawStart.wy, boxCurrent.wy) + 1) * TILE_PX;
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2 / zoom;
        ctx.setLineDash([6/zoom, 4/zoom]);
        ctx.strokeRect(x1, y1, x2-x1, y2-y1);
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(245,158,11,0.15)';
        ctx.fillRect(x1, y1, x2-x1, y2-y1);
    }

    // Paint box preview (default drag in paint mode)
    if (boxStart && boxCurrent && isPainting && !boxSelectMode && !areaCreationMode) {
        const x1 = Math.min(boxStart.wx, boxCurrent.wx) * TILE_PX;
        const y1 = Math.min(boxStart.wy, boxCurrent.wy) * TILE_PX;
        const x2 = (Math.max(boxStart.wx, boxCurrent.wx) + 1) * TILE_PX;
        const y2 = (Math.max(boxStart.wy, boxCurrent.wy) + 1) * TILE_PX;
        ctx.strokeStyle = eraserOn ? '#e94560' : '#4ade80';
        ctx.lineWidth = 2 / zoom;
        ctx.setLineDash([6/zoom, 4/zoom]);
        ctx.strokeRect(x1, y1, x2-x1, y2-y1);
        ctx.setLineDash([]);
        ctx.fillStyle = eraserOn ? 'rgba(233,69,96,0.15)' : 'rgba(74,222,128,0.15)';
        ctx.fillRect(x1, y1, x2-x1, y2-y1);
    }

    ctx.restore();
}

function drawZone(z) {
    const off = z.baked_offset || {x:0,y:0};
    const s = z.baked_scale || 1;
    const px = off.x * TILE_PX, py = off.y * TILE_PX;
    const pw = (z.width||25)*s*TILE_PX, ph = (z.height||25)*s*TILE_PX;
    const isFiltered = searchFilter && !z.zone_name.toLowerCase().includes(searchFilter) && !z.id.toLowerCase().includes(searchFilter);

    ctx.save();
    if (isFiltered) ctx.globalAlpha = 0.15;

    const cached = tileCache[z.id];
    if (cached && maptilesLoaded) {
        ctx.drawImage(cached, px, py, pw, ph);
    } else {
        const COLORS = {0:'#4b5563',8:'#78531e',16:'#1e3a6e',112:'#1a5c30',144:'#5ba8c8',192:'#0f3d1a',224:'#9a7b18',240:'#5a2e0a'};
        ctx.fillStyle = COLORS[z.tileset] || '#4b5563';
        ctx.globalAlpha *= 0.6;
        ctx.fillRect(px, py, pw, ph);
    }
    ctx.restore();
}

function drawZoneOutline(z) {
    const off = z.baked_offset || {x:0,y:0};
    const s = z.baked_scale || 1;
    const px = off.x * TILE_PX, py = off.y * TILE_PX;
    const pw = (z.width||25)*s*TILE_PX, ph = (z.height||25)*s*TILE_PX;
    const isSelected = selectedZone === z.id;

    ctx.save();
    ctx.strokeStyle = isSelected ? '#e94560' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = isSelected ? 4 : 1;
    ctx.strokeRect(px, py, pw, ph);
    if (isSelected) { ctx.fillStyle = 'rgba(233,69,96,0.08)'; ctx.fillRect(px, py, pw, ph); }
    ctx.restore();
}

function drawZoneLabel(z) {
    const off = z.baked_offset || {x:0,y:0};
    const s = z.baked_scale || 1;
    const px = off.x*TILE_PX, py = off.y*TILE_PX;
    const pw = (z.width||25)*s*TILE_PX, ph = (z.height||25)*s*TILE_PX;
    const screenW = pw * zoom;
    if (screenW < 30) return;
    const isFiltered = searchFilter && !z.zone_name.toLowerCase().includes(searchFilter) && !z.id.toLowerCase().includes(searchFilter);

    ctx.save();
    if (isFiltered) ctx.globalAlpha = 0.15;
    const fs = Math.max(8/zoom, Math.min(14/zoom, pw/6));
    const pad = 4/zoom;
    const ov = zoneOverrides[z.id];
    const name = (ov && ov.zone_name) || z.zone_name || z.id;
    ctx.font = `bold ${fs}px sans-serif`;
    const tm = ctx.measureText(name);
    const lw = tm.width + pad*3, lh = fs + pad*2;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.beginPath(); ctx.roundRect(px+pw/2-lw/2, py+ph/2-lh/2, lw, lh, pad); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(name, px+pw/2, py+ph/2);

    if (z.npc_count > 0 && screenW > 50) {
        const bs = fs*0.6;
        ctx.fillStyle = '#e94560'; ctx.beginPath(); ctx.arc(px+pw-bs*1.5, py+bs*1.5, bs*0.8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = `bold ${bs*0.9}px sans-serif`; ctx.fillText(z.npc_count, px+pw-bs*1.5, py+bs*1.5);
    }
    ctx.restore();
}

const NPC_COLORS = {shop:'#fbbf24',elder:'#60a5fa',scriptfile:'#4ade80',message:'#9ca3af',tips:'#a78bfa',craft:'#34d399',trainer:'#f472b6',pets:'#f9a8d4',maps:'#38bdf8'};
let selectedNpc = null; // {zoneId, idx}
let npcDialogueOverrides = {}; // "zoneId_idx" -> {dialogue: [...], notes: ""}
let playerSpawn = null; // {x: worldTileX, y: worldTileY} or null
let draggingSpawn = false;

function drawNpcSprite(npc, px, py, size) {
    const tile = npc.tile || npc.portrait || 0;
    const img = tile >= 256 ? chars2Img : charsImg;
    const local = tile >= 256 ? tile - 256 : tile;
    if (!img || !img.complete) return;
    const sx = (local % 16) * 32, sy = Math.floor(local / 16) * 32;
    ctx.drawImage(img, sx, sy, 32, 32, px - size/2, py - size/2, size, size);
}

function getNpcPos(zoneId, idx, npc) {
    const key = zoneId + '_' + idx;
    if (npcMoves[key]) return npcMoves[key];
    return { x: npc.x, y: npc.y };
}

function findNpcAt(wx, wy) {
    const hitR = Math.max(1.0, 3 / zoom); // tight hit radius — must click close to NPC
    for (const z of zones) {
        const zd = zonesMap[z.id];
        if (!zd || !zd.npcs) continue;
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        for (let i = 0; i < zd.npcs.length; i++) {
            const pos = getNpcPos(z.id, i, zd.npcs[i]);
            const nx = off.x + (pos.x + 0.5) * s;
            const ny = off.y + (pos.y + 0.5) * s;
            if (Math.abs(wx - nx) < hitR && Math.abs(wy - ny) < hitR) {
                return { zoneId: z.id, idx: i };
            }
        }
    }
    return null;
}

function drawNpcMarkers(z) {
    const zd = zonesMap[z.id];
    if (!zd || !zd.npcs || !zd.npcs.length) return;
    const off = z.baked_offset || {x:0,y:0};
    const s = z.baked_scale || 1;
    const screenW = (z.width||25)*s*TILE_PX*zoom;
    if (screenW < 60) return;

    ctx.save();
    const spriteSize = Math.max(10/zoom, Math.min(TILE_PX * s, 32/zoom));
    const fs = Math.max(5/zoom, Math.min(9/zoom, spriteSize * 0.35));

    for (let ni = 0; ni < zd.npcs.length; ni++) {
        const npc = zd.npcs[ni];
        const pos = getNpcPos(z.id, ni, npc);
        const px = (off.x + (pos.x + 0.5) * s) * TILE_PX;
        const py = (off.y + (pos.y + 0.5) * s) * TILE_PX;
        const color = NPC_COLORS[npc.type] || '#888';
        const isSelected = selectedNpc && selectedNpc.zoneId === z.id && selectedNpc.idx === ni;

        // Draw sprite
        drawNpcSprite(npc, px, py, spriteSize);

        // Colored border ring
        ctx.strokeStyle = isSelected ? '#fff' : color;
        ctx.lineWidth = (isSelected ? 2.5 : 1.5) / zoom;
        ctx.beginPath(); ctx.arc(px, py, spriteSize/2 + 1/zoom, 0, Math.PI*2); ctx.stroke();

        // Selected highlight
        if (isSelected) {
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 1 / zoom;
            ctx.setLineDash([4/zoom, 2/zoom]);
            ctx.beginPath(); ctx.arc(px, py, spriteSize/2 + 3/zoom, 0, Math.PI*2); ctx.stroke();
            ctx.setLineDash([]);
        }

        // Name label
        if (screenW > 150) {
            ctx.font = `bold ${fs}px sans-serif`;
            ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2/zoom;
            const nameY = py + spriteSize/2 + 1/zoom;
            ctx.strokeText(npc.name || '?', px - spriteSize/2, nameY);
            ctx.fillText(npc.name || '?', px - spriteSize/2, nameY);
            // Type badge
            ctx.font = `${fs * 0.8}px sans-serif`;
            ctx.fillStyle = color;
            ctx.strokeText(npc.type, px - spriteSize/2, nameY + fs + 1/zoom);
            ctx.fillText(npc.type, px - spriteSize/2, nameY + fs + 1/zoom);
        }
    }
    ctx.restore();
}

function drawPlayerSpawn() {
    if (!playerSpawn) return;
    const px = (playerSpawn.x + 0.5) * TILE_PX;
    const py = (playerSpawn.y + 0.5) * TILE_PX;
    const r = Math.max(6/zoom, 12/zoom);
    // Outer glow
    ctx.save();
    ctx.shadowColor = '#22d3ee';
    ctx.shadowBlur = 8/zoom;
    // Diamond shape
    ctx.fillStyle = '#22d3ee';
    ctx.beginPath();
    ctx.moveTo(px, py - r);
    ctx.lineTo(px + r*0.7, py);
    ctx.lineTo(px, py + r);
    ctx.lineTo(px - r*0.7, py);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5/zoom;
    ctx.stroke();
    ctx.shadowBlur = 0;
    // Label
    const fs = Math.max(6/zoom, 10/zoom);
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2.5/zoom;
    ctx.strokeText('SPAWN', px, py - r - 2/zoom);
    ctx.fillText('SPAWN', px, py - r - 2/zoom);
    ctx.restore();
}

function drawDungeonLabel(z) {
    if (!z.dungeon_base) return;
    const off = z.baked_offset || {x:0,y:0};
    const s = z.baked_scale || 1;
    const px = off.x * TILE_PX, py = off.y * TILE_PX;
    const pw = (z.width||25)*s*TILE_PX, ph = (z.height||25)*s*TILE_PX;
    const screenW = pw * zoom;
    if (screenW < 40) return;

    ctx.save();
    const fs = Math.max(6/zoom, Math.min(10/zoom, pw/8));
    const pad = 3/zoom;
    const label = `${z.dungeon_base} (${z.dungeon_count} floors)`;
    ctx.font = `bold ${fs}px sans-serif`;
    const tm = ctx.measureText(label);
    const lw = tm.width + pad*3, lh = fs + pad*2;
    const lx = px + pw/2 - lw/2, ly = py + ph/2 + fs*1.5;

    ctx.fillStyle = 'rgba(251,191,36,0.85)';
    ctx.beginPath(); ctx.roundRect(lx, ly, lw, lh, pad); ctx.fill();
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, px + pw/2, ly + lh/2);
    ctx.restore();
}

function drawQuestMarkers(z) {
    const zQuests = questsByZone[z.id];
    if (!zQuests || !zQuests.length) return;
    const off = z.baked_offset || {x:0,y:0};
    const s = z.baked_scale || 1;
    const px = off.x * TILE_PX, py = off.y * TILE_PX;
    const pw = (z.width||25)*s*TILE_PX;
    const screenW = pw * zoom;
    if (screenW < 40) return;

    ctx.save();
    const bs = Math.max(5/zoom, Math.min(10/zoom, pw/15));

    // Draw "!" markers, stacked vertically near top-left
    for (let i = 0; i < zQuests.length && i < 5; i++) {
        const mx = px + bs*2, my = py + bs*2 + i * bs*2.5;

        // Yellow circle
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.arc(mx, my, bs, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1/zoom;
        ctx.beginPath(); ctx.arc(mx, my, bs, 0, Math.PI*2); ctx.stroke();

        // "!" text
        ctx.fillStyle = '#000'; ctx.font = `bold ${bs*1.4}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('!', mx, my);

        // Quest title (when zoomed in)
        if (screenW > 150) {
            const fs = Math.max(5/zoom, Math.min(8/zoom, bs));
            ctx.font = `${fs}px sans-serif`;
            ctx.fillStyle = '#fbbf24'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2/zoom;
            ctx.strokeText(zQuests[i].title, mx + bs + 3/zoom, my);
            ctx.fillText(zQuests[i].title, mx + bs + 3/zoom, my);
        }
    }
    if (zQuests.length > 5) {
        const fs = Math.max(5/zoom, Math.min(8/zoom, bs));
        ctx.font = `${fs}px sans-serif`; ctx.fillStyle = '#fbbf24'; ctx.textAlign = 'left';
        ctx.fillText(`+${zQuests.length - 5} more`, px + bs*2, py + bs*2 + 5*bs*2.5);
    }
    ctx.restore();
}

function drawConnections() {
    ctx.save();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(233,69,96,0.3)'; ctx.setLineDash([6,4]);
    for (const z of zones) {
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        for (const ex of z.exits) {
            const t = zones.find(t => t.id === ex.target);
            if (!t) continue;
            const tOff = t.baked_offset || {x:0,y:0};
            const tS = t.baked_scale || 1;
            ctx.beginPath();
            ctx.moveTo((off.x + (ex.x||0)*s)*TILE_PX, (off.y + (ex.y||0)*s)*TILE_PX);
            ctx.lineTo((tOff.x + (ex.tx||0)*tS)*TILE_PX, (tOff.y + (ex.ty||0)*tS)*TILE_PX);
            ctx.stroke();
        }
    }
    ctx.restore();
}

function drawAnnotations() {
    ctx.save();
    for (const [zid, anns] of Object.entries(annotations)) {
        const z = zones.find(z => z.id === zid);
        if (!z) continue;
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        for (let i = 0; i < anns.length; i++) {
            const ann = anns[i];
            const px = (off.x + ann.x * s) * TILE_PX;
            const py = (off.y + ann.y * s) * TILE_PX;
            const isExpanded = selectedAnnotation && selectedAnnotation.zoneId === zid && selectedAnnotation.idx === i;
            const fs = Math.max(6/zoom, Math.min(11/zoom, 200));
            const pad = 4/zoom;

            if (isExpanded) {
                // Full text bubble with word wrap
                const maxW = 220/zoom;
                ctx.font = `${fs}px sans-serif`;
                const lines = wrapText(ctx, ann.text, maxW - pad*2);
                const bw = maxW, bh = lines.length * fs * 1.3 + pad*2;

                // Pin marker
                ctx.fillStyle = '#22c55e';
                ctx.beginPath(); ctx.arc(px, py, 4/zoom, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1/zoom;
                ctx.beginPath(); ctx.arc(px, py, 4/zoom, 0, Math.PI*2); ctx.stroke();

                // Text bubble
                const bx = px + 8/zoom, by = py - bh - 6/zoom;
                ctx.fillStyle = 'rgba(74,222,128,0.94)';
                ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, pad); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5/zoom;
                ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, pad); ctx.stroke();
                ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                lines.forEach((line, li) => {
                    ctx.fillText(line, bx + pad, by + pad + li * fs * 1.3);
                });
            } else {
                // Collapsed: small tag with truncated text preview
                ctx.font = `${fs}px sans-serif`;
                const preview = ann.text.length > 20 ? ann.text.slice(0, 18) + '..' : ann.text;
                const tw = ctx.measureText(preview).width;
                const bw = tw + pad*3 + 6/zoom; // extra space for pin circle
                const bh = fs * 1.3 + pad*2;
                const bx = px, by = py - bh/2;

                // Background pill
                ctx.fillStyle = 'rgba(74,222,128,0.85)';
                ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh/2); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1/zoom;
                ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh/2); ctx.stroke();

                // Pin dot
                ctx.fillStyle = '#16a34a';
                ctx.beginPath(); ctx.arc(bx + pad + 3/zoom, py, 3/zoom, 0, Math.PI*2); ctx.fill();

                // Preview text
                ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.fillText(preview, bx + pad*2 + 6/zoom, py);
            }
        }
    }
    ctx.restore();
}

function wrapText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = word;
        } else {
            line = test;
        }
    }
    if (line) lines.push(line);
    return lines.length ? lines : [''];
}

function drawImportedOverlay() {
    if (!importedChangeset) return;
    ctx.save();
    ctx.globalAlpha = 0.4;
    for (const [zid, changes] of Object.entries(importedChangeset.tile_changes || {})) {
        const z = zones.find(z => z.id === zid);
        if (!z) continue;
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        for (const [x, y, oldIdx, newIdx] of changes) {
            const px = (off.x + x*s) * TILE_PX;
            const py = (off.y + y*s) * TILE_PX;
            const pw = s * TILE_PX, ph = s * TILE_PX;
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(px, py, pw, ph);
        }
    }
    // Imported annotations
    for (const [zid, anns] of Object.entries(importedChangeset.annotations || {})) {
        const z = zones.find(z => z.id === zid);
        if (!z) continue;
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        for (const ann of anns) {
            const px = (off.x + ann.x*s)*TILE_PX, py = (off.y + ann.y*s)*TILE_PX;
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(px, py, 5/zoom, 0, Math.PI*2); ctx.fill();
        }
    }
    ctx.restore();
}

// ── Zone Selection ───────────────────────────────────────────────────────
function selectZone(zoneId) {
    selectedZone = zoneId;
    selectedCustomArea = null;
    const z = zones.find(z => z.id === zoneId);
    const ov = zoneOverrides[zoneId];
    const name = (ov && ov.zone_name) || (z ? z.zone_name : null) || zoneId;
    document.getElementById('panel-title').textContent = name;
    document.getElementById('panel-subtitle').textContent = zoneId;
    switchTab(currentTab);
    render();
}

// ── Tab Switching ────────────────────────────────────────────────────────
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('#panel-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    const content = document.getElementById('panel-content');

    if (tab === 'palette') { renderPaletteTab(); return; }
    if (tab === 'notes') { renderNotesTab(); return; }
    if (tab === 'ideas') { renderIdeasTab(); return; }
    if (tab === 'selection') { renderSelectionTab(); return; }
    if (!selectedZone || !zonesMap[selectedZone]) {
        content.innerHTML = '<p style="color:#666;text-align:center;margin-top:30px">Click a zone first</p>';
        return;
    }
    const d = zonesMap[selectedZone];
    switch (tab) {
        case 'info': renderInfoTab(d); break;
        case 'npcs': renderNpcsTab(d); break;
        case 'exits': renderExitsTab(d); break;
        case 'quests': renderQuestsTab(d); break;
    }
}

// Pre-render palette atlas as a data URL
let paletteDataUrl = '';
function buildPaletteAtlas() {
    if (!allSheetsLoaded) return;
    paletteDataUrl = SHEETS[0].img?.src || '';
    if (currentTab === 'palette') renderPaletteTab();
}

function renderPaletteTab() {
    const content = document.getElementById('panel-content');
    const sh = selectedSheet;
    const totalTiles = sh.cols * sh.rows;
    const displayPx = sh.tilePx === 8 ? 21 : 21; // display size in palette grid
    const localIdx = selectedTileIdx - sh.offset;

    // Spritesheet selector
    let html = '<div class="field" style="margin-bottom:6px"><label>Spritesheet</label>';
    html += '<select id="sheet-sel" onchange="switchSheet(this.value)" style="background:#0d1b2a;border:1px solid #1a4a8a;color:#e0e0e0;padding:3px;font-size:11px;width:100%">';
    for (const s of SHEETS) {
        html += `<option value="${s.id}" ${s.id===sh.id?'selected':''}>${s.name} (${s.cols}x${s.rows}, ${s.tilePx}px)</option>`;
    }
    html += '</select></div>';

    // Layer selector
    html += '<div class="field" style="margin-bottom:6px"><label>Paint Layer</label>';
    html += '<select id="layer-sel" onchange="activeLayer=this.value" style="background:#0d1b2a;border:1px solid #1a4a8a;color:#e0e0e0;padding:3px;font-size:11px;width:100%">';
    for (const l of PAINT_LAYERS) {
        html += `<option value="${l.id}" ${activeLayer===l.id?'selected':''}>${l.name} — ${l.desc}</option>`;
    }
    html += '</select></div>';

    // Brush size + selected preview
    html += '<div class="field-row" style="margin-bottom:6px;align-items:end"><div class="field"><label>Brush Size</label>';
    html += '<select id="brush-sel" onchange="brushSize=parseInt(this.value)" style="background:#0d1b2a;border:1px solid #1a4a8a;color:#e0e0e0;padding:3px;font-size:11px;width:100%">';
    html += `<option value="1" ${brushSize===1?'selected':''}>1x1</option>`;
    html += `<option value="2" ${brushSize===2?'selected':''}>2x2</option>`;
    html += `<option value="3" ${brushSize===3?'selected':''}>3x3</option>`;
    html += `<option value="5" ${brushSize===5?'selected':''}>5x5</option>`;
    html += '</select></div>';

    // Selected tile preview
    html += `<div class="field"><label>Selected: #${selectedTileIdx} (${sh.id}:${localIdx})</label>`;
    if (sh.img) {
        const prevSz = 32;
        const bgW = sh.cols * prevSz, bgH = sh.rows * prevSz;
        const bx = -(localIdx % sh.cols) * prevSz, by = -Math.floor(localIdx / sh.cols) * prevSz;
        html += `<div style="width:${prevSz}px;height:${prevSz}px;border:2px solid #e94560;border-radius:3px;image-rendering:pixelated;background-image:url('${sh.file}');background-size:${bgW}px ${bgH}px;background-position:${bx}px ${by}px"></div>`;
    }
    html += '</div></div>';

    // Tile grid
    html += `<div id="palette-grid" style="grid-template-columns:repeat(${sh.cols}, ${displayPx}px)">`;
    for (let i = 0; i < totalTiles; i++) {
        const col = i % sh.cols, row = Math.floor(i / sh.cols);
        const globalIdx = sh.offset + i;
        const bgW = sh.cols * displayPx, bgH = sh.rows * displayPx;
        const bgPos = `-${col*displayPx}px -${row*displayPx}px`;
        const imgSrc = sh.img ? sh.file : '';
        html += `<div class="ptile${globalIdx===selectedTileIdx?' selected':''}" data-idx="${globalIdx}" onclick="selectBrushTile(${globalIdx})" style="background-image:url('${imgSrc}');background-size:${bgW}px ${bgH}px;background-position:${bgPos}"></div>`;
    }
    html += '</div>';
    content.innerHTML = html;
}

function switchSheet(sheetId) {
    selectedSheet = SHEETS.find(s => s.id === sheetId) || SHEETS[0];
    selectedTileIdx = selectedSheet.offset; // select first tile of new sheet
    renderPaletteTab();
}

function selectBrushTile(idx) {
    selectedTileIdx = idx;
    const sheet = getSheetForIdx(idx);
    if (sheet.id !== selectedSheet.id) selectedSheet = sheet;
    eraserOn = false;
    document.getElementById('btn-eraser').classList.remove('active');
    setMode('paint');
    document.querySelectorAll('#palette-grid .ptile').forEach(el => {
        el.classList.toggle('selected', parseInt(el.dataset.idx) === idx);
    });
    renderPaletteTab();
}

function renderInfoTab(d) {
    const ov = zoneOverrides[d.id] || {};
    const name = ov.zone_name !== undefined ? ov.zone_name : (d.zone_name || '');
    const desc = ov.description !== undefined ? ov.description : (d.description || '');
    document.getElementById('panel-content').innerHTML = `
        <div class="field"><label>Zone Name</label><input id="edit-zone-name" value="${esc(name)}" oninput="saveZoneOverride('${d.id}','zone_name',this.value)"></div>
        <div class="field"><label>Description</label><textarea id="edit-zone-desc" oninput="saveZoneOverride('${d.id}','description',this.value)">${esc(desc)}</textarea></div>
        <div class="field-row">
            <div class="field"><label>Width</label><input value="${d.width}" readonly></div>
            <div class="field"><label>Height</label><input value="${d.height}" readonly></div>
            <div class="field"><label>Tileset</label><input value="${d.tileset}" readonly></div>
        </div>
        <div class="field-row">
            <div class="field"><label>Scale</label><input value="${d.baked_scale||1}" readonly></div>
            <div class="field"><label>Dungeon</label><input value="${d.dungeon_base||'none'}" readonly></div>
        </div>
    `;
}

function saveZoneOverride(zoneId, field, value) {
    if (!zoneOverrides[zoneId]) zoneOverrides[zoneId] = {};
    zoneOverrides[zoneId][field] = value;
    // Update the panel title if zone name changed
    if (field === 'zone_name' && selectedZone === zoneId) {
        document.getElementById('panel-title').textContent = value || zoneId;
    }
    saveAnnotations();
    render(); // re-draw labels
}

function renderNpcsTab(d) {
    const npcs = d.npcs || [];
    if (!npcs.length) { document.getElementById('panel-content').innerHTML = '<p style="color:#666;text-align:center;margin-top:20px">No NPCs</p>'; return; }
    let html = '';
    npcs.forEach((npc, ni) => {
        const color = NPC_COLORS[npc.type] || '#888';
        const tile = npc.tile || npc.portrait || 0;
        const isChars2 = tile >= 256;
        const local = isChars2 ? tile - 256 : tile;
        const file = isChars2 ? 'chars2.png' : 'chars.png';
        const bgX = (local % 16) * 24, bgY = Math.floor(local / 16) * 24;
        const isSel = selectedNpc && selectedNpc.zoneId === d.id && selectedNpc.idx === ni;
        html += `<div onclick="selectNpcByIdx('${d.id}',${ni})" style="display:flex;align-items:center;gap:8px;padding:6px;background:${isSel ? '#1a3a5a' : '#0d1b2a'};border:1px solid ${isSel ? '#fbbf24' : '#1a4a8a'};border-radius:4px;margin-bottom:3px;cursor:pointer">
            <div style="width:24px;height:24px;flex-shrink:0;border-radius:3px;border:2px solid ${color};background-image:url('${file}');background-size:${16*24}px ${16*24}px;background-position:-${bgX}px -${bgY}px;image-rendering:pixelated"></div>
            <div style="flex:1;min-width:0">
                <div style="font-size:11px;font-weight:bold;color:#e0e0e0">${esc(npc.name || '?')}</div>
                <div style="font-size:9px;color:${color}">${npc.type}${npc.shop ? ' — shop: ' + npc.shop : ''}</div>
            </div>
            <div style="font-size:9px;color:#666">(${npc.x},${npc.y})</div>
        </div>`;
    });
    document.getElementById('panel-content').innerHTML = html;
}

function selectNpcByIdx(zoneId, idx) {
    selectedNpc = { zoneId, idx };
    // Pan camera to NPC location
    const zd = zonesMap[zoneId];
    if (zd && zd.npcs && zd.npcs[idx]) {
        const z = zones.find(z => z.id === zoneId);
        const off = z?.baked_offset || {x:0,y:0};
        const s = z?.baked_scale || 1;
        const npc = zd.npcs[idx];
        const pos = getNpcPos(zoneId, idx, npc);
        const worldX = (off.x + (pos.x + 0.5) * s) * TILE_PX;
        const worldY = (off.y + (pos.y + 0.5) * s) * TILE_PX;
        zoom = Math.max(zoom, 1.5);
        camX = canvas.width/2 - worldX * zoom;
        camY = canvas.height/2 - worldY * zoom;
    }
    renderNpcPanel(selectedNpc);
    switchTab('npcs');
    render();
}

function renderNpcPanel(npcRef) {
    const zd = zonesMap[npcRef.zoneId];
    if (!zd || !zd.npcs || !zd.npcs[npcRef.idx]) return;
    const npc = zd.npcs[npcRef.idx];
    const color = NPC_COLORS[npc.type] || '#888';
    const tile = npc.tile || npc.portrait || 0;
    const isChars2 = tile >= 256;
    const local = isChars2 ? tile - 256 : tile;
    const file = isChars2 ? 'chars2.png' : 'chars.png';
    const bgX = (local % 16) * 48, bgY = Math.floor(local / 16) * 48;
    const key = npcRef.zoneId + '_' + npcRef.idx;
    const overrides = npcDialogueOverrides[key] || {};
    const pos = getNpcPos(npcRef.zoneId, npcRef.idx, npc);

    // Find related quests
    const relQuests = (WORLD_DATA.quests ? Object.values(WORLD_DATA.quests) : []).filter(q =>
        q.giver === npc.name || q.location === npcRef.zoneId
    );
    // Find shop data
    const shopData = npc.shop && WORLD_DATA.shops ? WORLD_DATA.shops[npc.shop] : null;

    let html = `<div style="margin-bottom:8px">
        <button onclick="renderNpcsTab(zonesMap['${npcRef.zoneId}'])" style="background:none;border:none;color:#60a5fa;cursor:pointer;font-size:10px;padding:0;margin-bottom:6px">← Back to NPC list</button>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <div style="width:48px;height:48px;flex-shrink:0;border-radius:4px;border:2px solid ${color};background-image:url('${file}');background-size:${16*48}px ${16*48}px;background-position:-${bgX}px -${bgY}px;image-rendering:pixelated"></div>
            <div>
                <div style="font-size:14px;font-weight:bold;color:#e0e0e0">${esc(npc.name || '?')}</div>
                <div style="font-size:10px;color:${color}">${npc.type} — tile #${tile}</div>
                <div style="font-size:10px;color:#888">Zone: ${npcRef.zoneId} — Pos: (${pos.x}, ${pos.y})</div>
            </div>
        </div>
    </div>`;

    // Dialogue/message
    if (npc.message) {
        html += `<div style="margin-bottom:8px;padding:6px;background:#0d1b2a;border:1px solid #1a4a8a;border-radius:4px">
            <div style="font-size:10px;color:#888;margin-bottom:3px">Message:</div>
            <div style="font-size:11px;color:#e0e0e0;white-space:pre-wrap">${esc(npc.message)}</div>
        </div>`;
    }
    if (npc.file) {

function goToAnnotation(zid, idx) {
    const z = zonesMap[zid];
    const ann = annotations[zid]?.[idx];
    if (!z || !ann) return;
    const off = z.baked_offset || {x:0,y:0};
    const s = z.baked_scale || 1;
    const worldX = (off.x + ann.x * s) * TILE_PX;
    const worldY = (off.y + ann.y * s) * TILE_PX;
    zoom = 1.5;
    camX = canvas.width/2 - worldX * zoom;
    camY = canvas.height/2 - worldY * zoom;
    selectedAnnotation = { zoneId: zid, idx };
    render();
}

function removeAnnotation(zid, idx) {
    if (annotations[zid]) { annotations[zid].splice(idx, 1); saveAnnotations(); updateStatus(); render(); renderNotesTab(); }
}

// ── Export / Import Changeset ───────────────────────────────────────────

function resetBaseline() {
    _snapshotBaseline();
    showToast('Baseline set to current state. Next diff export will only include new changes.');
}

function updateBaselineInfo() {
    const el = document.getElementById('baseline-info');
    if (!el) return;
    if (baseline && baseline.timestamp) {
        const d = new Date(baseline.timestamp);
        el.textContent = `Baseline: ${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;
        el.style.color = '#4ade80';
    } else {
        el.textContent = 'No baseline (diff = all edits)';
        el.style.color = '#e94560';
    }
}

function _snapshotBaseline() {
    // Deep-copy current state as the new baseline
    baseline = {
        timestamp: new Date().toISOString(),
        layerPaints: JSON.parse(JSON.stringify(layerPaints)),
        customAreas: JSON.parse(JSON.stringify(customAreas)),
        npcMoves: JSON.parse(JSON.stringify(npcMoves)),
        zoneOverrides: JSON.parse(JSON.stringify(zoneOverrides)),
        npcDialogueOverrides: JSON.parse(JSON.stringify(npcDialogueOverrides)),
        playerSpawn: playerSpawn ? JSON.parse(JSON.stringify(playerSpawn)) : null,
    };
    saveAnnotations();
    updateBaselineInfo();
}

function _diffLayerPaints() {
    // Return only tiles that changed since baseline
    const diff = {};
    const basePaints = baseline ? baseline.layerPaints : {};
    for (const layerDef of PAINT_LAYERS) {
        const lid = layerDef.id;
        const current = layerPaints[lid];
        const base = basePaints[lid] || {};
        const entries = [];
        // New or changed tiles
        for (const [key, spriteIdx] of Object.entries(current)) {
            if (base[key] === undefined || base[key] !== spriteIdx) {
                const [tx, ty] = key.split(',').map(Number);
                entries.push([tx, ty, spriteIdx]);
            }
        }
        if (entries.length) diff[lid] = entries;
    }
    return diff;
}

function _diffArray(current, baseArr, nameKey) {
    // Return items in current that aren't in base (by name)
    if (!baseArr || !baseArr.length) return current;
    const baseNames = new Set(baseArr.map(a => a[nameKey || 'name']));
    return current.filter(a => !baseNames.has(a[nameKey || 'name']));
}

function _diffObject(current, base) {
    // Return keys in current that differ from base
    const diff = {};
    for (const [k, v] of Object.entries(current)) {
        if (!base || JSON.stringify(base[k]) !== JSON.stringify(v)) {
            diff[k] = v;
        }
    }
    return diff;
}

function exportChangeset() {
    const author = document.getElementById('author-name').value || 'Anonymous';
    const changeset = {
        version: 1,
        author,
        timestamp: new Date().toISOString(),
        annotations: {},
        ideas: {},
    };

    if (baseline) {
        changeset.baseline_timestamp = baseline.timestamp;
    }

    // Collect ideas
    for (const key of ['npcs','dungeons','quests','general']) {
        if (savedIdeas[key] && savedIdeas[key].trim()) changeset.ideas[key] = savedIdeas[key].trim();
    }

    // Layer paints — only tiles changed since baseline
    const diffPaints = _diffLayerPaints();
    let tileCount = 0;
    if (Object.keys(diffPaints).length) {
        changeset.layer_paints = diffPaints;
        tileCount = Object.values(diffPaints).reduce((s, v) => s + v.length, 0);
    }

    // Custom areas / enemy spawns — only new ones since baseline
    const baseAreas = baseline ? baseline.customAreas : [];
    const newAreas = _diffArray(customAreas, baseAreas, 'name');
    const enemySpawns = newAreas.filter(a => a.type === 'enemy_spawn').map(a => ({name: a.name, x1: a.x1, y1: a.y1, x2: a.x2, y2: a.y2}));
    const otherAreas = newAreas.filter(a => a.type !== 'enemy_spawn');
    if (otherAreas.length) changeset.custom_areas = otherAreas;
    if (enemySpawns.length) changeset.enemy_spawns = enemySpawns;

    // NPC moves — only new/changed since baseline
    const diffNpcMoves = _diffObject(npcMoves, baseline ? baseline.npcMoves : null);
    if (Object.keys(diffNpcMoves).length) changeset.npc_moves = diffNpcMoves;

    // Zone overrides — only new/changed
    const diffZoneOverrides = _diffObject(zoneOverrides, baseline ? baseline.zoneOverrides : null);
    if (Object.keys(diffZoneOverrides).length) changeset.zone_overrides = diffZoneOverrides;

    // NPC dialogue — only new/changed
    const diffDialogue = _diffObject(npcDialogueOverrides, baseline ? baseline.npcDialogueOverrides : null);
    if (Object.keys(diffDialogue).length) changeset.npc_dialogue = diffDialogue;

    // Player spawn — only if changed
    const baseSpawn = baseline ? baseline.playerSpawn : null;
    if (playerSpawn && JSON.stringify(playerSpawn) !== JSON.stringify(baseSpawn)) {
        changeset.player_spawn = playerSpawn;
    }

    // Annotations
    for (const [zid, anns] of Object.entries(annotations)) {
        if (anns.length) changeset.annotations[zid] = anns;
    }

    const totalNotes = Object.values(changeset.annotations).reduce((s, v) => s + v.length, 0);
    const hasIdeas = Object.keys(changeset.ideas).length > 0;
    const hasAnything = tileCount > 0 || enemySpawns.length > 0 || otherAreas.length > 0 ||
        Object.keys(diffNpcMoves).length > 0 || Object.keys(diffZoneOverrides).length > 0 ||
        Object.keys(diffDialogue).length > 0 || changeset.player_spawn || totalNotes > 0 || hasIdeas;

    if (!hasAnything) {
        showToast('Nothing new since last export', true);
        return;
    }

    const blob = new Blob([JSON.stringify(changeset, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `changeset_${author.replace(/\s+/g,'_')}_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);

    // Snapshot current state as new baseline
    _snapshotBaseline();
    const parts = [];
    if (tileCount > 0) parts.push(`${tileCount} tiles`);
    if (enemySpawns.length) parts.push(`${enemySpawns.length} spawn regions`);
    if (otherAreas.length) parts.push(`${otherAreas.length} areas`);
    if (Object.keys(diffNpcMoves).length) parts.push(`${Object.keys(diffNpcMoves).length} NPC moves`);
    if (changeset.player_spawn) parts.push('spawn point');
    if (totalNotes) parts.push(`${totalNotes} notes`);
    showToast(`Exported: ${parts.join(', ') || 'metadata only'}. Baseline updated.`);
}

function exportFullMap() {
    if (!terrainReady) { showToast('Terrain not loaded yet', true); return; }
    const author = document.getElementById('author-name').value || 'Anonymous';
    showToast('Building full map export... this may take a moment');

    setTimeout(() => {
        const fullMap = {
            version: 2,
            type: 'full_map',
            author,
            timestamp: new Date().toISOString(),
            layer_paints: { ground: [], paths: [], buildings: [], objects: [], decor: [] },
        };

        // Collect all world tile coordinates from all sources
        const allKeys = new Set();
        for (const key in terrainGround) allKeys.add(key);
        for (const key in terrainOverlay) allKeys.add(key);
        for (const layerDef of PAINT_LAYERS) {
            for (const key in layerPaints[layerDef.id]) allKeys.add(key);
        }

        let groundCount = 0, upperCount = 0;

        for (const key of allKeys) {
            const [tx, ty] = key.split(',').map(Number);

            // Ground: paint override > overlay > base terrain
            const groundPaint = layerPaints.ground[key];
            let groundTile;
            if (groundPaint !== undefined) {
                groundTile = groundPaint;
            } else {
                const overlay = terrainOverlay ? terrainOverlay[key] : undefined;
                const base = terrainGround ? terrainGround[key] : undefined;
                if (overlay !== undefined && overlay >= 0) {
                    groundTile = overlay;
                } else if (base !== undefined) {
                    groundTile = base;
                } else {
                    groundTile = -1;
                }
            }
            if (groundTile !== undefined && groundTile >= 0) {
                fullMap.layer_paints.ground.push([tx, ty, groundTile]);
                groundCount++;
            }

            // Upper layers: emit paint data
            for (let li = 1; li < PAINT_LAYERS.length; li++) {
                const lid = PAINT_LAYERS[li].id;
                const v = layerPaints[lid][key];
                if (v !== undefined && v >= 0) {
                    fullMap.layer_paints[lid].push([tx, ty, v]);
                    upperCount++;
                }
            }
        }

        // Remove empty layers
        for (const lid in fullMap.layer_paints) {
            if (fullMap.layer_paints[lid].length === 0) delete fullMap.layer_paints[lid];
        }

        // Include all metadata
        if (Object.keys(npcMoves).length) fullMap.npc_moves = npcMoves;
        const fmEnemySpawns = customAreas.filter(a => a.type === 'enemy_spawn').map(a => ({name: a.name, x1: a.x1, y1: a.y1, x2: a.x2, y2: a.y2}));
        const fmOtherAreas = customAreas.filter(a => a.type !== 'enemy_spawn');
        if (fmOtherAreas.length) fullMap.custom_areas = fmOtherAreas;
        if (fmEnemySpawns.length) fullMap.enemy_spawns = fmEnemySpawns;
        if (Object.keys(zoneOverrides).length) fullMap.zone_overrides = zoneOverrides;
        if (Object.keys(npcDialogueOverrides).length) fullMap.npc_dialogue = npcDialogueOverrides;
        if (playerSpawn) fullMap.player_spawn = playerSpawn;

        // Zone + NPC data
        const zoneData = {};
        for (const z of zones) {
            const zd = zonesMap[z.id];
            if (!zd) continue;
            zoneData[z.id] = {
                zone_name: z.zone_name,
                baked_offset: z.baked_offset,
                baked_scale: z.baked_scale,
                width: z.width, height: z.height,
                tileset: z.tileset,
                npcs: (zd.npcs || []).map((npc, idx) => {
                    const pos = getNpcPos(z.id, idx, npc);
                    return { name: npc.name || npc.id, type: npc.type, x: pos.x, y: pos.y, tile: npc.tile || 0 };
                }),
            };
        }
        fullMap.zones = zoneData;

        // Annotations and ideas
        const anns = {};
        for (const [zid, a] of Object.entries(annotations)) {
            if (a.length) anns[zid] = a;
        }
        if (Object.keys(anns).length) fullMap.annotations = anns;
        const ideas = {};
        for (const key of ['npcs','dungeons','quests','general']) {
            if (savedIdeas[key] && savedIdeas[key].trim()) ideas[key] = savedIdeas[key].trim();
        }
        if (Object.keys(ideas).length) fullMap.ideas = ideas;

        const totalTiles = groundCount + upperCount;
        const blob = new Blob([JSON.stringify(fullMap)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fullmap_${author.replace(/\s+/g,'_')}_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        const sizeMB = (blob.size / 1024 / 1024).toFixed(1);
        _snapshotBaseline();
        showToast(`Full map exported: ${totalTiles.toLocaleString()} tiles (${sizeMB} MB). Baseline updated.`);
    }, 50);
}

function importChangeset() {
    document.getElementById('import-file').click();
}

function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            importedChangeset = JSON.parse(ev.target.result);
            const tc = Object.values(importedChangeset.tile_changes || {}).reduce((s,v) => s+v.length, 0);
            // Merge imported annotations into main annotations
            let an = 0;
            for (const [zid, anns] of Object.entries(importedChangeset.annotations || {})) {
                if (!annotations[zid]) annotations[zid] = [];
                for (const ann of anns) {
                    // Avoid duplicates (same position + text)
                    const dup = annotations[zid].some(a => a.x === ann.x && a.y === ann.y && a.text === ann.text);
                    if (!dup) { annotations[zid].push(ann); an++; }
                }
            }
            // Merge NPC moves
            if (importedChangeset.npc_moves) {
                Object.assign(npcMoves, importedChangeset.npc_moves);
            }
            // Merge custom areas
            if (importedChangeset.custom_areas) {
                for (const a of importedChangeset.custom_areas) {
                    if (!customAreas.some(e => e.name === a.name)) customAreas.push(a);
                }
            }
            // Merge zone overrides
            if (importedChangeset.zone_overrides) {
                for (const [zid, ov] of Object.entries(importedChangeset.zone_overrides)) {
                    if (!zoneOverrides[zid]) zoneOverrides[zid] = {};
                    Object.assign(zoneOverrides[zid], ov);
                }
            }
            // Merge NPC dialogue overrides
            if (importedChangeset.npc_dialogue) {
                Object.assign(npcDialogueOverrides, importedChangeset.npc_dialogue);
            }
            // Player spawn
            if (importedChangeset.player_spawn) {
                playerSpawn = importedChangeset.player_spawn;
            }
            // Merge per-layer paints (new format)
            let tp = 0;
            if (importedChangeset.layer_paints) {
                for (const [lid, entries] of Object.entries(importedChangeset.layer_paints)) {
                    if (!layerPaints[lid]) layerPaints[lid] = {};
                    for (const entry of entries) {
                        const key = entry[0] + ',' + entry[1];
                        layerPaints[lid][key] = entry[2];
                        tp++;
                        const cx = Math.floor(entry[0] / TERRAIN_CHUNK), cy = Math.floor(entry[1] / TERRAIN_CHUNK);
                        delete terrainChunks[cx + ',' + cy];
                    }
                }
            } else if (importedChangeset.terrain_paints) {
                // Legacy: import into ground layer
                for (const entry of importedChangeset.terrain_paints) {
                    const key = entry[0] + ',' + entry[1];
                    layerPaints.ground[key] = entry[2];
                    tp++;
                    const cx = Math.floor(entry[0] / TERRAIN_CHUNK), cy = Math.floor(entry[1] / TERRAIN_CHUNK);
                    delete terrainChunks[cx + ',' + cy];
                }
            }
            terrainPaints = layerPaints.ground;
            // Post-import migration: move misplaced tiles from buildings/objects to decor
            let migrated = 0;
            for (const fromId of ['buildings', 'objects']) {
                const src = layerPaints[fromId];
                if (!src) continue;
                for (const [key, idx] of Object.entries(src)) {
                    if (idx < 0) continue; // skip void
                    if (!layerPaints.decor[key] || layerPaints.decor[key] < 0) {
                        layerPaints.decor[key] = idx;
                    }
                    delete src[key];
                    migrated++;
                    const [tx, ty] = key.split(',').map(Number);
                    const cx = Math.floor(tx / TERRAIN_CHUNK), cy = Math.floor(ty / TERRAIN_CHUNK);
                    delete terrainChunks[cx + ',' + cy];
                }
            }
            if (migrated > 0) console.log(`Migrated ${migrated} tiles from buildings/objects → decor`);
            // Merge imported ideas
            const imp = importedChangeset.ideas || {};
            for (const key of ['npcs','dungeons','quests','general']) {
                if (imp[key]) {
                    savedIdeas[key] = savedIdeas[key] ? savedIdeas[key] + '\n' + imp[key] : imp[key];
                }
            }
            saveAnnotations();
            showToast(`Imported: ${importedChangeset.author} — ${tc + tp} tiles, ${an} notes merged`);
            render();
        } catch (err) {
            showToast('Invalid changeset file', true);
        }
    };
    reader.readAsText(file);
    e.target.value = '';
}

// ── Utilities ────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function filterZones(q) { searchFilter = q.toLowerCase(); render(); }

function updateStatus() {
    document.getElementById('status-zoom').textContent = `Zoom: ${(zoom*100).toFixed(0)}%`;
    let tc = 0;
    for (const m of Object.values(tileChanges)) tc += m.size;
    for (const lp of Object.values(layerPaints)) tc += Object.keys(lp).length;
    document.getElementById('status-changes').textContent = `Changes: ${tc} | Layer: ${activeLayer}`;
    let nc = 0;
    for (const a of Object.values(annotations)) nc += a.length;
    document.getElementById('status-notes').textContent = `Notes: ${nc}`;
}

function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? '#e94560' : '#4ade80';
    t.style.color = isError ? '#fff' : '#000';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Tile Remover ────────────────────────────────────────────────────────
function toggleReplaceWith() {
    const action = document.getElementById('tr-action').value;
    document.getElementById('tr-replace-row').style.display = action === 'replace' ? '' : 'none';
}

function openTileRemover() {
    const modal = document.getElementById('tile-remover-modal');
    modal.style.display = 'flex';
    // Populate area dropdown
    const sel = document.getElementById('tr-area');
    sel.innerHTML = '';
    for (const z of zones) {
        const opt = document.createElement('option');
        opt.value = 'zone:' + z.id;
        opt.textContent = z.zone_name || z.id;
        // Pre-select current zone
        if (selectedZone === z.id) opt.selected = true;
        sel.appendChild(opt);
    }
    for (const area of customAreas) {
        const opt = document.createElement('option');
        opt.value = 'custom:' + area.name;
        opt.textContent = area.name + ' (custom)';
        sel.appendChild(opt);
    }
    updateTileRemoverPreview();
    toggleReplaceWith();
}

function updateTileRemoverPreview() {
    const preview = document.getElementById('tr-tile-preview');
    const { sheet, localIdx } = getSheetLocalIdx(selectedTileIdx);
    if (sheet.img) {
        const sz = 32;
        preview.style.backgroundImage = `url('${sheet.file}')`;
        preview.style.backgroundSize = `${sheet.cols*sz}px ${sheet.rows*sz}px`;
        preview.style.backgroundPosition = `-${(localIdx%sheet.cols)*sz}px -${Math.floor(localIdx/sheet.cols)*sz}px`;
        preview.style.imageRendering = 'pixelated';
    }
    document.getElementById('tr-tile-label').textContent = `Tile #${selectedTileIdx} (${sheet.id}:${localIdx})`;
}

function closeTileRemover() {
    document.getElementById('tile-remover-modal').style.display = 'none';
}

function executeTileRemoval() {
    const areaVal = document.getElementById('tr-area').value;
    const action = document.getElementById('tr-action').value;
    const replaceWith = action === 'replace' ? parseInt(document.getElementById('tr-replace-idx').value) : -1;
    const targetTile = selectedTileIdx;

    let x1, y1, x2, y2;
    if (areaVal.startsWith('zone:')) {
        const zid = areaVal.slice(5);
        const z = zonesMap[zid];
        if (!z) { showToast('Zone not found', true); return; }
        const off = z.baked_offset || {x:0,y:0};
        const s = z.baked_scale || 1;
        x1 = Math.floor(off.x); y1 = Math.floor(off.y);
        x2 = Math.floor(off.x + (z.width||25)*s);
        y2 = Math.floor(off.y + (z.height||25)*s);
    } else if (areaVal.startsWith('custom:')) {
        const name = areaVal.slice(7);
        const area = customAreas.find(a => a.name === name);
        if (!area) { showToast('Area not found', true); return; }
        x1 = area.x1; y1 = area.y1; x2 = area.x2; y2 = area.y2;
    }

    const gid = ++undoGroupId;
    const paintLayer = layerPaints[activeLayer];
    let count = 0;
    const chunksToInvalidate = new Set();
    for (let ty = y1; ty <= y2; ty++) {
        for (let tx = x1; tx <= x2; tx++) {
            const key = tx + ',' + ty;
            let current = getLayerTile(key);
            if (current === targetTile) {
                paintLayer[key] = replaceWith;
                undoStack.push({ terrain: true, layer: activeLayer, wx: tx, wy: ty, oldIdx: current, newIdx: replaceWith, group: gid });
                chunksToInvalidate.add(Math.floor(tx / TERRAIN_CHUNK) + ',' + Math.floor(ty / TERRAIN_CHUNK));
                count++;
            }
        }
    }
    redoStack = [];
    invalidateChunks(chunksToInvalidate);
    saveAnnotations();
    closeTileRemover();
    const verb = action === 'replace' ? `Replaced ${count} tiles with #${replaceWith}` : `Removed ${count} tiles`;
    showToast(verb);
    updateStatus();
    render();
}

document.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName;
    const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

    // Ctrl shortcuts work even in inputs
    if (e.ctrlKey && e.shiftKey && e.key === 'Z') { e.preventDefault(); redo(); return; }
    if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); return; }

    // Don't trigger single-key shortcuts while typing
    if (inInput) return;

    if (e.key === 'Escape') {
        // Cancel in-progress box draw
        if (boxStart) {
            boxStart = null; boxCurrent = null; isPainting = false;
            render();
            return;
        }
        // Cancel in-progress selection draw
        if (selectionStart) {
            selectionStart = null; boxCurrent = null; isPainting = false;
            render();
            return;
        }
        // Clear existing selection
        if (selection) {
            clearSelection();
            return;
        }
        document.getElementById('ann-popup').style.display = 'none';
        importedChangeset = null;
        selectedAnnotation = null;
        render();
    }
    if (e.key === 'b') setMode('paint');
    if (e.key === 'v') setMode('pan');
    if (e.key === 'n') setMode('annotate');
    if (e.key === 'e') toggleEraser();
    if (e.key === 'i') { setMode('paint'); eyedropMode(); }
    if (e.key === 's') { setMode('paint'); toggleBoxSelect(); }
});

init();
</script>
